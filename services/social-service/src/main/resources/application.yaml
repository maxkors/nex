spring:
  application:
    name: social-service
  datasource:
    url: jdbc:postgresql://localhost:5432/social_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
